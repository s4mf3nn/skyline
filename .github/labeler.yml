# Étiquetage automatique du risque selon les chemins touchés (source : docs/factory/RISK.md)
# Lu aussi par scripts/pre-review.mjs pour choisir le niveau de revue : garder le format `- "glob"` sous chaque étiquette.
# Les globs applicatifs commencent par `**/` : ils valent pour `src/` comme pour un paquet (`web/src/`, `apps/api/src/`).
# `node scripts/pre-review.mjs zones` liste ceux qui ne correspondent à aucun fichier du dépôt.
"risk:high":
  - changed-files:
      - any-glob-to-any-file:
          # Zones sensibles du domaine (voir docs/factory/DOMAIN-SECURITY.md)
          # Position de l'utilisateur et seul appel sortant qui la porte.
          - "**/shared/location/**"
          - "**/shared/adsb/**"
          # Images de compagnies : aucune sans autorisation consignée.
          - "**/assets/tails/**"
          # Permissions de l'appareil, identifiants de l'application et livraison (EAS).
          - "app.json"
          - "app.config.*"
          - "eas.json"
          - "**/config/**"
          # Zones par défaut de la factory, sans fichier en v0 : gardées pour le compte et le backend du MVP.
          - "**/migrations/**"
          - "**/features/auth/**"
          - "**/shared/**/auth*"
          - "**/features/admin/**"
          # Suivi des erreurs (Sentry, imposé par la factory) : filtre des données personnelles et configuration.
          - "**/shared/monitoring/**"
          - "**/sentry.*"
          - "**/.sentryclirc"
          # La factory elle-même
          - ".github/**"
          - ".claude/**"
          - "CLAUDE.md"
          - "scripts/**"

# Niveau de revue `full` (relecteur sur Opus, coûteux) : réservé au code applicatif sensible. Distinct de `risk:high`,
# qui impose la revue humaine : l'outillage de la factory est risque élevé sans déclencher Opus (lu par scripts/pre-review.mjs).
"review:full":
  - changed-files:
      - any-glob-to-any-file:
          # Zones sensibles du domaine (voir docs/factory/DOMAIN-SECURITY.md)
          - "**/shared/location/**"
          - "**/shared/adsb/**"
          - "**/assets/tails/**"
          - "app.json"
          - "app.config.*"
          - "eas.json"
          - "**/config/**"
          # Zones par défaut de la factory, sans fichier en v0 : gardées pour le compte et le backend du MVP.
          - "**/migrations/**"
          - "**/features/auth/**"
          - "**/shared/**/auth*"
          - "**/features/admin/**"
          - "**/shared/monitoring/**"
          - "**/sentry.*"
          - "**/.sentryclirc"

"risk:medium":
  - changed-files:
      - any-glob-to-any-file:
          # Dossier de routes d'Expo Router (point d'entrée de l'application, posé par SPEC-0000).
          - "app/**"
          - "**/features/**/service.ts"
          # Code partagé entre features (middleware, erreurs, client réseau) : une erreur s'y propage partout.
          - "**/shared/**"
          - "**/package.json"

"contract":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/acceptance/**"
          - "tests/holdout/**"
