name: gates

on:
  pull_request:
  # Après chaque fusion : deux PR vertes séparément peuvent casser main ensemble (pas de merge queue).
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gates-${{ github.ref }}
  # Pas d'annulation d'un run en cours sur main (GitHub ne garde qu'un run en attente par groupe : /land lit le dernier).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: true

  gates:
    runs-on: ubuntu-latest
    # Base de données : décommenter si le projet utilise Postgres (voir docs/factory/BOILERPLATE.md, « Options »).
    # services:
    #   postgres:
    #     image: postgres:17
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: app_ci
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    # env:
    #   DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_ci
    #   # Valeurs factices non secrètes pour les tests d'acceptation.
    #   API_KEYS: ci-test-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present gen
      - run: pnpm run --if-present db:migrate
      - name: Typage
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests et couverture
        run: pnpm test:coverage
      - name: Contrat confié à un autre lanceur que Vitest
        # Sans effet tant que package.json ne déclare pas `factory.contractRunners` (voir scripts/contract-files.mjs).
        run: pnpm test:contract
      - name: Build
        # Sans effet tant que package.json n'a pas de script `build` (posé par SPEC-0000 si l'application se construit).
        run: pnpm run --if-present build
      - name: Contrat des tests d'acceptation
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-contract.mjs
      - name: Scénarios cachés
        # Décompte seul dans les logs : le détail d'un échec est réservé à l'humain (voir docs/factory/WORKFLOW.md).
        run: node scripts/holdout.mjs run
      - name: Mutation testing sur les fichiers modifiés
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # :(glob) pour que `**` inclue aussi les fichiers directement sous src/ (src/app.ts), et `**/src/` les
          # paquets d'un dépôt à plusieurs applications (web/src/, apps/api/src/).
          # Un point d'entrée qu'aucun test ne charge (ici src/server.ts, à adapter à la stack) est exclu :
          # ses mutants seraient NoCoverage. Idem pour un fichier testé par un autre lanceur que Vitest.
          FILES=$(git diff --name-only --diff-filter=AM "$BASE_REF"...HEAD -- ':(glob)**/src/**/*.ts' ':(glob)**/src/**/*.tsx' \
            | grep -v -E '(\.(test|gen)\.tsx?|(^|/)src/server\.ts)$' | paste -sd, - || true)
          if [ -n "$FILES" ]; then pnpm exec stryker run --mutate "$FILES"; else echo "Rien à muter"; fi

  e2e:
    # Tests sur cible réelle (navigateur, simulateur, paquet installé, binaire), en CI seulement : pas dans `pnpm verify`.
    # Sans effet tant que package.json n'a pas de script `test:e2e` (lanceur choisi dans l'ADR-0001).
    # Variables de dépôt : E2E_RUNNER (défaut ubuntu-latest ; un simulateur iOS demande un runner macOS) et
    # E2E_NODE_VERSIONS (tableau JSON, défaut [22]). Services (base, API) : à ajouter ici par SPEC-0000.
    runs-on: ${{ vars.E2E_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(vars.E2E_NODE_VERSIONS || '[22]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Script test:e2e présent ?
        id: e2e
        run: echo "present=$(node -p "Boolean(require('./package.json').scripts?.['test:e2e'])")" >> "$GITHUB_OUTPUT"
      - if: steps.e2e.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - if: steps.e2e.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.e2e.outputs.present == 'true'
        run: pnpm run --if-present gen && pnpm run --if-present build
      - name: Tests sur cible réelle
        if: steps.e2e.outputs.present == 'true'
        run: pnpm test:e2e

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gitleaks commente la PR quand il détecte une fuite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Semgrep
        run: |
          pipx install semgrep==1.179.0
          node scripts/security-scan.mjs semgrep
