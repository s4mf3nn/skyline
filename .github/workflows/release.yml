name: release

# Livraison (déploiement, publication sur un store ou un registre de paquets), déclenchée à la main depuis main.
# Lance `pnpm release`, script écrit par SPEC-0000 d'après l'ADR-0001 (Implications, ligne « Livraison ») : aucun
# fournisseur n'est codé ici. Secrets et approbation humaine : environnement GitHub `production`
# (voir docs/factory/BOILERPLATE.md, « Réglages GitHub »).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # lecture du dernier run `gates` sur main

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    environment: production
    steps:
      - name: Livraison depuis main seulement
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Livraison refusée : lancée depuis $GITHUB_REF, main attendue." >&2
            exit 1
          fi
      - name: gates vert sur ce commit de main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CONCLUSION=$(gh run list --workflow gates --branch main --event push --commit "$GITHUB_SHA" --limit 1 \
            --json conclusion -q '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "Livraison refusée : gates n'est pas vert sur $GITHUB_SHA (conclusion : ${CONCLUSION:-aucun run})." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Script release présent
        run: |
          node -e "if (!require('./package.json').scripts?.release) {
            console.error('Aucun script release dans package.json : à poser par SPEC-0000 (docs/adr/0001-stack.md, Livraison).');
            process.exit(1);
          }"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --if-present gen && pnpm run --if-present build
      - name: Livraison
        run: pnpm release
        # Secrets de l'environnement `production` : à exposer ici par SPEC-0000, un par ligne, jamais en argument.
        # env:
        #   RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
