name: risk

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          sync-labels: true
      - name: Taille du diff et niveau de risque
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          LABELS=$(gh pr view "$PR" --json labels -q '.labels[].name')
          LINES=$(gh pr view "$PR" --json additions,deletions -q '.additions + .deletions')
          if echo "$LABELS" | grep -q 'risk:high'; then
            gh pr comment "$PR" --body "Risque élevé : revue humaine approfondie obligatoire (voir docs/factory/RISK.md)."
          elif [ "$LINES" -gt 400 ]; then
            gh pr edit "$PR" --add-label "risk:medium"
            gh pr comment "$PR" --body "Diff de $LINES lignes : trop gros pour une revue rapide, envisager un redécoupage."
          elif ! echo "$LABELS" | grep -q 'risk:medium'; then
            gh pr edit "$PR" --add-label "risk:low"
            # Phase 3 de la roadmap uniquement : décommenter pour activer l'auto-merge sur risque faible
            # (prérequis dans docs/factory/WORKFLOW.md : scénarios cachés sur les specs, `gates` vert sur main)
            # gh pr merge "$PR" --auto --squash
          fi
