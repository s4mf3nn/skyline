<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:54px;color:{{ color }};font-family:-apple-system,'DM Sans',sans-serif">
  <div style="position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px"></div>
  <div style="position:absolute;left:46px;top:18px;font-size:16px;font-weight:600;letter-spacing:-0.01em">{{ time }}</div>
  <div style="position:absolute;right:32px;top:21px;display:flex;align-items:center;gap:6px">
    <div style="display:flex;align-items:flex-end;gap:2px;height:11px">
      <div style="width:3px;height:4px;border-radius:1px;background:currentColor"></div>
      <div style="width:3px;height:6px;border-radius:1px;background:currentColor"></div>
      <div style="width:3px;height:8px;border-radius:1px;background:currentColor"></div>
      <div style="width:3px;height:11px;border-radius:1px;background:currentColor"></div>
    </div>
    <div style="width:24px;height:12px;border-radius:4px;border:1px solid currentColor;padding:1.5px;box-sizing:border-box"><div style="width:75%;height:100%;border-radius:2px;background:currentColor"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:54},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#000000&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;13:27&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { color: this.props.color ?? '#000', time: this.props.time ?? '13:27' }; }
}
</script>
</body>
</html>
